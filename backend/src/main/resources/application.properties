spring.application.name=mock-exams-backend

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/mock_exams}
spring.datasource.username=${DATABASE_USERNAME:mock_exams}
spring.datasource.password=${DATABASE_PASSWORD:mock_exams}

spring.data.redis.url=${REDIS_URL:redis://localhost:6379}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:101MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:105MB}

management.endpoints.web.exposure.include=health,info

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

app.jwt.issuer=${JWT_ISSUER:mock-exams-local}
app.jwt.secret=${JWT_SECRET:dev-only-change-me-local-jwt-secret-32-chars}
app.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:PT1H}
app.jwt.refresh-token-ttl=${JWT_REFRESH_TOKEN_TTL:P7D}

app.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
app.minio.bucket=${MINIO_BUCKET:mock-exams-local}
app.minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
app.minio.secret-key=${MINIO_SECRET_KEY:minioadmin}

app.redis.url=${REDIS_URL:redis://localhost:6379}

app.openai.enabled=${OPENAI_ENABLED:false}
app.openai.api-key=${OPENAI_API_KEY:dev-only-openai-api-key}
app.openai.model=${OPENAI_MODEL:gpt-4.1-mini}
app.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}

app.transcription.provider=${TRANSCRIPTION_PROVIDER:mock}
app.transcription.model=${TRANSCRIPTION_MODEL:gpt-4o-mini-transcribe}
app.transcription.max-audio-duration=${TRANSCRIPTION_MAX_AUDIO_DURATION:PT5M}
app.transcription.cost-per-minute=${TRANSCRIPTION_COST_PER_MINUTE:0.000000}

app.ai.usage.period=${AI_USAGE_PERIOD:monthly}
app.ai.usage.free-requests-limit=${AI_USAGE_FREE_REQUESTS_LIMIT:20}
app.ai.usage.hard-limit-requests=${AI_USAGE_HARD_LIMIT_REQUESTS:50}
app.ai.usage.count-provider-failures=${AI_USAGE_COUNT_PROVIDER_FAILURES:false}
app.ai.usage.prompt-token-cost-per-1k=${AI_USAGE_PROMPT_TOKEN_COST_PER_1K:0.000000}
app.ai.usage.completion-token-cost-per-1k=${AI_USAGE_COMPLETION_TOKEN_COST_PER_1K:0.000000}
app.ai.writing.provider=${AI_WRITING_PROVIDER:mock}
app.ai.speaking.provider=${AI_SPEAKING_PROVIDER:mock}
app.ai.study-plan.provider=${AI_STUDY_PLAN_PROVIDER:mock}

app.payments.enabled=${PAYMENT_ENABLED:false}
app.payments.provider=${PAYMENT_PROVIDER:mock}
app.payments.api-key=${PAYMENT_API_KEY:dev-only-payment-api-key}
app.payments.webhook-secret=${PAYMENT_WEBHOOK_SECRET:dev-only-payment-webhook-secret}

app.google.client-id=${GOOGLE_CLIENT_ID:dev-only-google-client-id}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:dev-only-google-client-secret}
app.google.platform-calendar-id=${GOOGLE_PLATFORM_CALENDAR_ID:dev-only-google-calendar-id}
